---
- name: Instalar Docker e Docker Compose v2
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
    state: present
    update_cache: true

- name: Garantir que Docker esteja ativo
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Verificar versao do Docker
  ansible.builtin.command: docker --version
  register: docker_version
  changed_when: false

- name: Verificar versao do Docker Compose
  ansible.builtin.command: docker compose version
  register: compose_version
  changed_when: false

- name: Exibir versoes instaladas
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ compose_version.stdout }}"
