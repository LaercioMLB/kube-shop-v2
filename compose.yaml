name: kube-shop

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    image: kube-shop/frontend:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [web]
    logging: *logging

  api:
    image: kube-shop/api:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MONGO_HOST: mongodb
      MONGO_DATABASE: kubeshop
      MONGO_AUTH_SOURCE: kubeshop
      MONGO_USERNAME: kubeshop
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets: [mongo_app_password]
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 20s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready',{signal:AbortSignal.timeout(2500)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 30s
    networks: [web, data]
    logging: *logging

  mongodb:
    image: mongo:8.0.17
    command: [--bind_ip_all, --wiredTigerCacheSizeGB, "0.25"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_root_password
      MONGO_INITDB_DATABASE: kubeshop
      MONGO_APP_USERNAME: kubeshop
      MONGO_APP_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets: [mongo_root_password, mongo_app_password]
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/10-app-user.js:ro
      - ./docker/mongodb/healthcheck.js:/opt/healthcheck.js:ro
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, mongosh, --quiet, --file, /opt/healthcheck.js]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [data]
    logging: *logging

networks:
  web:
  data:
    internal: true

volumes:
  mongo-data:
  mongo-config:

secrets:
  mongo_app_password:
    file: ./.secrets/mongo-app-password
  mongo_root_password:
    file: ./.secrets/mongo-root-password
