name: kube-shop-app

services:
  frontend:
    image: kube-shop/frontend:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks: [web]

  api:
    image: kube-shop/api:${APP_VERSION:-1.0.0}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      APP_VERSION: ${APP_VERSION:-1.0.0}
      MONGO_HOST: ${MONGO_HOST:?Informe o IP privado do MongoDB}
      MONGO_PORT: "27017"
      MONGO_DATABASE: kubeshop
      MONGO_AUTH_SOURCE: kubeshop
      MONGO_USERNAME: kubeshop
      MONGO_PASSWORD_FILE: /run/secrets/mongo_app_password
    secrets:
      - mongo_app_password
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 3
      start_period: 30s
    networks: [web]

networks:
  web:

secrets:
  mongo_app_password:
    file: ./.secrets/mongo-app-password
